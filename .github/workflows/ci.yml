name: ci

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Record start time
        shell: bash
        run: echo "JOB_START=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: pnpm
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-
      - run: pnpm install --frozen-lockfile
      - name: Lint, typecheck, test (affected only)
        run: pnpm turbo run lint typecheck test --filter='...[origin/main]'
      - name: Root policy tests
        run: node --test scripts/*.test.mjs
      - name: Job duration
        if: always()
        shell: bash
        run: |
          echo "checks duration: $(( $(date +%s) - JOB_START ))s" >> "$GITHUB_STEP_SUMMARY"

  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Record start time
        shell: bash
        run: echo "JOB_START=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: make up
      - name: Integration tests (affected only)
        run: pnpm turbo run test:integration --filter='...[origin/main]'
      - name: Tear down
        if: always()
        run: make down v=1
      - name: Job duration
        if: always()
        shell: bash
        run: |
          echo "integration duration: $(( $(date +%s) - JOB_START ))s" >> "$GITHUB_STEP_SUMMARY"

  security:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: pnpm
      # gitleaks v8.30.1, official release binary; checksum from gitleaks_8.30.1_checksums.txt, pinned here
      # https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
      - name: Install gitleaks (checksum-verified)
        shell: bash
        run: |
          curl -sSfL -O "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks_8.30.1_linux_x64.tar.gz" > gitleaks.sha256
          sha256sum -c gitleaks.sha256
          tar -xzf gitleaks_8.30.1_linux_x64.tar.gz gitleaks
      - name: Secret scan (PR range)
        run: ./gitleaks detect --redact --no-banner --log-opts="origin/main..HEAD"
      - name: Dependency audit (prod, critical)
        run: pnpm audit --prod --audit-level critical
      - run: pnpm install --frozen-lockfile
      - name: Licence gate
        shell: bash
        run: |
          out=$(pnpm licenses list --prod --json) || [ "$out" = "No licenses in packages found" ]
          printf '%s' "$out" | node scripts/check-licenses.mjs

  pins:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
      - name: Verify action pins match upstream tags
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/check-action-pins.mjs
