name: contracts

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: contracts-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  spec:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # python3 is preinstalled on ubuntu-24.04; the VNPay golden vectors need it
      - run: python3 --version
      - name: Spectral lint
        run: pnpm --filter @vck/contracts-tools run lint:spec
      - name: Event schemas compile
        run: pnpm --filter @vck/contracts-tools run compile
      - name: VNPay golden vectors
        run: pnpm --filter @vck/contracts-tools run vectors

  generated:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Regenerate types, validators and mocks
        run: pnpm --filter @vck/contracts-tools run gen
      - name: Fail on generated-output drift
        shell: bash
        run: |
          node tools/contracts/check-generated.mjs || {
            echo "::error::Generated files are out of date. Run make contracts and commit the result."
            exit 1
          }
