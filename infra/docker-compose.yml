# VCK local infrastructure. DEV ONLY: every credential below is a placeholder, never reuse it.
name: vck

x-health: &health
  interval: 5s
  timeout: 5s
  retries: 10
  start_period: 5s

services:
  postgres:
    image: postgres:16.15-alpine3.24
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vck}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vck}
      POSTGRES_DB: ${POSTGRES_DB:-vck}
    ports: ["127.0.0.1:${POSTGRES_PORT:-5432}:5432"]
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      <<: *health
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U ${POSTGRES_USER:-vck} -d ${POSTGRES_DB:-vck}"]

  redis:
    image: redis:7.4.11-alpine3.21
    ports: ["127.0.0.1:${REDIS_PORT:-6379}:6379"]
    healthcheck:
      <<: *health
      test: ["CMD", "redis-cli", "ping"]

  meilisearch:
    image: getmeili/meilisearch:v1.54.2
    environment:
      MEILI_ENV: development
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:-dev-only-meili-key}
    ports: ["127.0.0.1:${MEILI_PORT:-7700}:7700"]
    volumes: [meili-data:/meili_data]
    healthcheck:
      <<: *health
      test: ["CMD", "curl", "-fsS", "http://localhost:7700/health"]

  # ponytail: minio/minio and quay.io/minio/minio no longer publish images (upstream archived);
  # pgsty/minio is a maintained community fork rebuilding the same binary. LOCAL DEV ONLY, never prod.
  # Pinned by multi-arch index digest since the fork is not an official source. Swap when a better one exists.
  minio:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z@sha256:b6bfe7239bfc83fb90d31612d9704d86039dd714f7904b3f1ad68f211e602372
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-vck}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-vck-dev-only}
    # 9000 is reserved for backend-server, hence 9002/9003 on the host.
    ports:
      - "127.0.0.1:${MINIO_API_PORT:-9002}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9003}:9001"
    volumes: [minio-data:/data]
    healthcheck:
      <<: *health
      test: ["CMD", "mc", "ready", "local"]

  mailpit:
    image: axllent/mailpit:v1.31.3
    ports:
      - "127.0.0.1:${MAILPIT_SMTP_PORT:-1025}:1025"
      - "127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025"
    healthcheck:
      <<: *health
      test: ["CMD", "/mailpit", "readyz"]

  # minio/mc is not pullable, so reuse the mc bundled in the pgsty/minio image. Long-running on purpose:
  # `up --wait` fails on exited containers (even exit 0), so it stays alive and is healthy once the bucket exists.
  minio-init:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z@sha256:b6bfe7239bfc83fb90d31612d9704d86039dd714f7904b3f1ad68f211e602372
    restart: "no"
    init: true # tini as PID 1 forwards SIGTERM, so `down` does not wait out the 10 s grace period
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MC_HOST_local: http://${MINIO_ROOT_USER:-vck}:${MINIO_ROOT_PASSWORD:-vck-dev-only}@minio:9000
    entrypoint: ["/bin/sh", "-c"]
    command:
      - mc mb --ignore-existing local/vck-media && exec sleep infinity
    healthcheck:
      <<: *health
      test: ["CMD-SHELL", "mc ls local/vck-media"]

  vnpay-sim:
    image: node:20.20.2-alpine
    command: ["node", "/sim/server.mjs"]
    environment: { PORT: "9100" }
    ports: ["127.0.0.1:${VNPAY_SIM_PORT:-9100}:9100"]
    volumes: ["../tools/sims/vnpay/server.mjs:/sim/server.mjs:ro"]
    healthcheck:
      <<: *health
      test: ["CMD", "wget", "-qO-", "http://localhost:9100/health"]

  ghn-sim:
    image: node:20.20.2-alpine
    command: ["node", "/sim/server.mjs"]
    environment: { PORT: "9101" }
    ports: ["127.0.0.1:${GHN_SIM_PORT:-9101}:9101"]
    volumes: ["../tools/sims/ghn/server.mjs:/sim/server.mjs:ro"]
    healthcheck:
      <<: *health
      test: ["CMD", "wget", "-qO-", "http://localhost:9101/health"]

volumes:
  postgres-data:
  meili-data:
  minio-data:
