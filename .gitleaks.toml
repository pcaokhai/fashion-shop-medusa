[extend]
useDefault = true

# fake test secret, contracts/fixtures: placeholder order-lookup token in a sample fixture; the second path is the same
# token inlined by tools/contracts gen-msw into the generated MSW handlers (exact files only, never a directory)
[[allowlists]]
description = "fake test token, contracts/fixtures"
condition = "AND"
paths = ['''^contracts/fixtures/order-lookup-session\.json$''', '''^apps/storefront/src/generated/msw-handlers\.ts$''']
regexes = ['''^olt_4f1c9a0e7b2d4c6f8a1e3b5d7c9f0a2b4d6e8f0a1c3e5b7d9f1a3c5e7b9d1f3a$''']
